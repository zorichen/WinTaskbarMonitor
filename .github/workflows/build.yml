name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from source
        shell: powershell
        run: .\build.ps1
      - name: Verify executable metadata and icon
        shell: powershell
        run: |
          $assembly = [Reflection.Assembly]::LoadFile((Resolve-Path 'bin\TaskbarMonitor.exe'))
          if ($assembly.GetName().Version.ToString() -ne '1.0.3.0') { throw 'Unexpected version' }
          if ('TaskbarMonitor.AppIcon' -notin $assembly.GetManifestResourceNames()) { throw 'Missing icon' }
          .\tools\test-startup-build.ps1
      - name: Check GPU selection and DPI layout
        shell: powershell
        run: .\tools\test-monitor.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WinTaskbarMonitor-windows-x64
          path: bin/
